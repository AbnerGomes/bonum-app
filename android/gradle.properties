# 4G basta para o Bonum (a máquina de build tem ~5G livres). IPv4 forçado: a rede do container não tem IPv6.
# DNS: guarda endereços resolvidos por 10 min e não guarda falhas (a rede tem soluços de DNS).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Dsun.net.inetaddr.ttl=600 -Dsun.net.inetaddr.negative.ttl=0
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Mais tentativas, com espera maior, ao baixar dependências (soluços de rede).
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
